[package]
name = "ilo3-gateway"
version = "0.1.0"
edition = "2021"
description = "Reverse proxy that lets a modern browser reach an HP iLO 3 web interface"

[dependencies]
# OpenSSL rather than rustls: rustls will not speak TLS 1.0, which is all an iLO 3 offers.
#
# Vendored on purpose. Distribution builds of OpenSSL 3 are compiled with no-weak-ssl-ciphers,
# which removes 3DES and RC4 outright — the only ciphers an iLO 3 offers. Linking the system
# library therefore fails the handshake before the device is even consulted. Building our own is
# the whole point of this tool: it exists to speak a protocol nothing else will.
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
strip = true
